{% macro icon(name='layers') -%}
<svg
  class="studio-icon"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.4"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  {% if name == 'browser' %}
  <rect x="3" y="4" width="18" height="16" rx="1" />
  <path d="M3 9h18M7 6.5h.01M10 6.5h.01M8 9v11" />
  {% elif name == 'search' %}
  <circle cx="10.5" cy="10.5" r="6.5" />
  <path d="m16 16 5 5" />
  {% elif name == 'structure' %}
  <rect x="9" y="3" width="6" height="5" />
  <rect x="2" y="16" width="6" height="5" />
  <rect x="16" y="16" width="6" height="5" />
  <path d="M12 8v4M5 16v-4h14v4" />
  {% elif name == 'pen' %}
  <path d="m15 3 6 6-11 11-7 1 1-7ZM12 6l6 6M4 14l6 6" />
  {% elif name == 'code' %}
  <path d="m7 6-6 6 6 6m10-12 6 6-6 6M14 3l-4 18" />
  {% elif name == 'shield' %}
  <path d="m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6ZM8 12l3 3 5-6" />
  {% elif name == 'launch' %}
  <path
    d="M14 5c3-3 7-3 7-3s0 4-3 7l-7 7-5-5ZM6 11H2l5-6h7M11 16v6l6-6v-6M3 16l5 5M2 22l3-3"
  />
  {% elif name == 'handover' %}
  <path d="M4 8V3h16v5M12 2v12m-4-4 4 4 4-4M3 14v7h18v-7" />
  {% elif name == 'ruler' %}
  <path d="m3 16 13-13 5 5L8 21ZM12 7l3 3M8 11l3 3M5 15l3 3" />
  {% elif name == 'mail' %}
  <rect x="2" y="4" width="20" height="16" rx="1" />
  <path d="m2 5 10 8L22 5" />
  {% elif name == 'globe' %}
  <circle cx="12" cy="12" r="9" />
  <ellipse cx="12" cy="12" rx="4" ry="9" />
  <path d="M3 12h18" />
  {% elif name == 'file' %}
  <path d="M14 2H4v20h16V8ZM14 2v6h6M8 12h8M8 16h6" />
  {% else %}
  <path d="m12 3 10 6-10 6L2 9ZM2 13l10 6 10-6M2 17l10 6 10-6" />
  {% endif %}
</svg>
{%- endmacro %}
