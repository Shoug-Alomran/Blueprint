- en: Every Blueprint build starts with the essentials.
  ar: كل مشروع في بلو برينت يبدأ بالأساسيات.
- en: Discovery
  ar: الاستكشاف
- en: Understand the purpose, audience, and content goals.
  ar: فهم الغرض والجمهور وأهداف المحتوى.
- en: Structure
  ar: الهيكل
- en: Plan pages, navigation, and hierarchy.
  ar: تخطيط الصفحات والتنقل والتسلسل.
- en: Design
  ar: التصميم
- en: Create a consistent responsive visual experience.
  ar: بناء تجربة بصرية متسقة ومتجاوبة.
- en: Build
  ar: البناء
- en: Develop the finished static website.
  ar: تطوير الموقع الثابت بصيغته النهائية.
- en: Testing
  ar: الاختبار
- en: Review responsiveness, links, and functionality.
  ar: مراجعة التجاوب والروابط والوظائف.
- en: Publish the finished website live.
  ar: نشر الموقع المكتمل على الإنترنت.
- en: Handover
  ar: التسليم
- en: Deliver a clean, maintainable structure.
  ar: تسليم هيكل نظيف وسهل الصيانة.
- en: ADD-ONS://OPTIONAL
  ar: الإضافات · اختيارية
- en: Extend your build.
  ar: وسع مشروعك.
- en: Additional Pages
  ar: صفحات إضافية
- en: Add pages to your agreed scope. The final cost depends on the content and structure required. Scope and price are confirmed before work begins.
  ar: أضف صفحات إلى النطاق المتفق عليه. تعتمد التكلفة النهائية على المحتوى والهيكل المطلوبين. يؤكد النطاق والسعر قبل بدء العمل.
- en: Content Formatting
  ar: تنسيق المحتوى
- en: Organize supplied text, images, and documents for a consistent reading experience. Scope and price are confirmed before work begins.
  ar: تنظيم النصوص والصور والمستندات التي تقدمها لتجربة قراءة متسقة. يؤكد النطاق والسعر قبل بدء العمل.
- en: Revision Rounds
  ar: جولات تعديل
- en: Request additional review rounds beyond those agreed in your project scope. Scope and price are confirmed before work begins.
  ar: اطلب جولات مراجعة إضافية تتجاوز ما اتفق عليه في نطاق مشروعك. يؤكد النطاق والسعر قبل بدء العمل.
- en: Custom Animations
  ar: حركات مخصصة
- en: Add considered motion and interactions that support your content. Scope and price are confirmed before work begins.
  ar: أضف حركات وتفاعلات مدروسة تخدم محتواك. يؤكد النطاق والسعر قبل بدء العمل.
- en: Advanced SEO Setup
  ar: إعداد SEO متقدم
- en: Discuss additional search metadata and page optimization needs. Scope and price are confirmed before work begins.
  ar: ناقش احتياجاتك من بيانات البحث الوصفية الإضافية وتحسين الصفحات. يؤكد النطاق والسعر قبل بدء العمل.
- en: Domain Configuration
  ar: إعداد النطاق
- en: Connect your own domain, including DNS and HTTPS configuration. Domain registration is separate. Scope and price are confirmed before work begins.
  ar: ربط نطاقك الخاص، بما في ذلك إعداد DNS وHTTPS. تسجيل النطاق منفصل. يؤكد النطاق والسعر قبل بدء العمل.
- en: Website Migration
  ar: نقل الموقع
- en: Move an existing static website into the agreed new structure. Scope and price are confirmed before work begins.
  ar: نقل موقع ثابت قائم إلى الهيكل الجديد المتفق عليه. يؤكد النطاق والسعر قبل بدء العمل.
- en: Additional Documentation
  ar: توثيق إضافي
- en: Receive additional project-specific guides and handover material. Scope and price are confirmed before work begins.
  ar: احصل على أدلة إضافية خاصة بمشروعك ومواد تسليم. يؤكد النطاق والسعر قبل بدء العمل.
- en: What determines your quote?
  ar: ما الذي يحدد عرض السعر؟
