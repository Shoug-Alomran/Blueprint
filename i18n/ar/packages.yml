- en: Services & Pricing - Blueprint
  ar: الخدمات والأسعار - بلو برينت
- en: Compare Blueprint website packages, add-ons, pricing tiers, CV templates, and HTML report options for static website projects.
  ar: قارن باقات مواقع بلو برينت وإضافاتها وفئات الأسعار، وقوالب السيرة الذاتية، وخيارات تحويل التقارير إلى HTML لمشاريع المواقع الثابتة.
- en: SERVICES://PRICING <i></i>
  ar: الخدمات · الأسعار <i></i>
- en: Clear scope.<br>Clear pricing.<br><em>No surprises.</em>
  ar: نطاق واضح.<br>أسعار واضحة.<br><em>بلا مفاجآت.</em>
- en: Blueprint keeps website projects straightforward. Choose the level of support you need, understand exactly what’s included, and build from there.
  ar: 'يبقي بلو برينت مشاريع المواقع بسيطة وواضحة: اختر مستوى الدعم الذي تحتاجه، واعرف بالضبط ما الذي يشمله، وانطلق من هناك.'
- en: PROJECT-BASED · CLEAR SCOPE · NO SUBSCRIPTIONS
  ar: حسب المشروع · نطاق واضح · بلا اشتراكات
- en: PRICING_MODEL
  ar: نموذج التسعير
- en: Built around the project,<br>not a monthly subscription.
  ar: تسعير حسب المشروع،<br>لا اشتراك شهري.
- en: Blueprint’s pricing reflects the website’s scope, content, complexity, and required customization. You invest in a finished asset, not a recurring obligation.
  ar: يعكس تسعير بلو برينت نطاق الموقع ومحتواه ومدى تعقيده والتخصيص المطلوب. أنت تستثمر في أصل مكتمل، لا في التزام متكرر.
