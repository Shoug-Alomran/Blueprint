- en: Frequently Asked Questions
  ar: الأسئلة الشائعة
- en: Do I need to know exactly what type of website I need?
  ar: هل يجب أن أعرف بالضبط نوع الموقع الذي أحتاجه؟
- en: No. Start with your goal and content. We’ll help determine the right structure and scope during discovery.
  ar: لا. ابدأ بهدفك ومحتواك، وسنساعدك على تحديد الهيكل والنطاق المناسبين خلال مرحلة الاستكشاف.
- en: Can I request changes during the project?
  ar: هل يمكنني طلب تعديلات أثناء المشروع؟
- en: Yes. Each tier includes defined revision rounds. Additions outside the agreed scope are discussed and quoted before implementation.
  ar: نعم. تشمل كل فئة جولات تعديل محددة، وأي إضافة خارج النطاق المتفق عليه تناقش ويقدم لها عرض سعر قبل التنفيذ.
- en: Do I need to provide the content?
  ar: هل علي تقديم المحتوى؟
- en: Yes. You provide text, images, and relevant materials. Blueprint organizes what you provide into a clear digital experience.
  ar: نعم. تقدم النصوص والصور والمواد ذات الصلة، وينظمها بلو برينت في تجربة رقمية واضحة.
- en: Can Blueprint redesign an existing website?
  ar: هل يمكن لبلو برينت إعادة تصميم موقع قائم؟
- en: Yes, when the project fits our static website scope. Share the current site and the changes you need for a scope review.
  ar: نعم، إذا كان المشروع ضمن نطاق المواقع الثابتة. شارك الموقع الحالي والتغييرات المطلوبة لنراجع النطاق.
- en: Will my website work on mobile?
  ar: هل سيعمل موقعي على الجوال؟
- en: Yes. Responsive layouts and checks across screen sizes are part of every website build.
  ar: نعم. التخطيطات المتجاوبة واختبار مختلف مقاسات الشاشات جزء من كل مشروع.
- en: Can I request something that isn’t listed?
  ar: هل يمكنني طلب شيء غير مذكور؟
- en: Absolutely. Send the requirement and we’ll confirm whether it fits Blueprint’s capabilities and provide an appropriate quote.
  ar: بالتأكيد. أرسل المتطلب وسنؤكد إن كان ضمن قدرات بلو برينت ونقدم لك عرض السعر المناسب.
