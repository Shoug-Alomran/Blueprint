- en: Purpose-built static websites — portfolio sites, CV websites, course and academic hubs, documentation, and interactive HTML reports.
  ar: مواقع ثابتة مبنية لغرض محدد — مواقع ملفات الأعمال، ومواقع السيرة الذاتية، ومنصات المقررات، والتوثيق، وتقارير HTML التفاعلية.
