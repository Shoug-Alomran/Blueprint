- en: CLIENT://INPUT
  ar: العميل · المدخلات
- en: Built around<br>your perspective.
  ar: مبني حول<br>رؤيتك.
- en: What you bring to the build.
  ar: ما تقدمه للمشروع.
- en: Text, project information, descriptions, or academic material that needs to appear on your website.
  ar: النصوص ومعلومات المشروع والأوصاف أو المواد الأكاديمية التي يجب أن تظهر في موقعك.
- en: Assets
  ar: الملفات
- en: Logos, images, documents, branding materials, and other relevant files.
  ar: الشعارات والصور والمستندات ومواد الهوية وغيرها من الملفات ذات الصلة.
- en: Direction
  ar: التوجه
- en: Your goals, preferences, references, and expectations.
  ar: أهدافك وتفضيلاتك ومراجعك وتوقعاتك.
- en: Feedback
  ar: الملاحظات
- en: Clear feedback during review so the result matches the agreed direction.
  ar: ملاحظات واضحة أثناء المراجعة لتأتي النتيجة مطابقة للتوجه المتفق عليه.
- en: <strong>Don’t have everything organized yet? That’s okay.</strong ><br>Blueprint helps structure the material you provide into a clear digital experience.
  ar: <strong>لم ترتب كل شيء بعد؟ لا بأس.</strong ><br>يساعدك بلو برينت على تنظيم المواد التي تقدمها في تجربة رقمية واضحة.
- en: COMMUNICATION://CLEAR
  ar: التواصل · واضح
- en: No guessing where<br>your project stands.
  ar: لا حاجة للتخمين<br>أين وصل مشروعك.
- en: You’ll know which stage your project is in, what has been completed, and what we need from you next.
  ar: ستعرف في أي مرحلة مشروعك، وما الذي اكتمل، وما الذي نحتاجه منك بعد ذلك.
- en: EXAMPLE PROJECT STATUS
  ar: حالة مشروع / مثال
- en: READY FOR INPUT
  ar: جاهز لاستقبال المدخلات
- en: READY FOR INPUT<span class="studio-cursor">_</span>
  ar: جاهز لاستقبال المدخلات<span class="studio-cursor">_</span>
- en: A FEW MORE DETAILS
  ar: تفاصيل إضافية
- en: Before we get started.
  ar: قبل أن نبدأ.
- en: Do I need to know exactly what website I want?
  ar: هل يجب أن أعرف بالضبط الموقع الذي أريده؟
- en: No. You can start with your goal and content, and the appropriate structure can be determined during discovery.
  ar: لا. يمكنك البدء بهدفك ومحتواك، ويحدد الهيكل المناسب خلال مرحلة الاستكشاف.
- en: When does development begin?
  ar: متى يبدأ التطوير؟
- en: Development begins after the project’s scope and requirements have been established.
  ar: يبدأ التطوير بعد تحديد نطاق المشروع ومتطلباته.
- en: Can the scope change during the project?
  ar: هل يمكن أن يتغير النطاق أثناء المشروع؟
- en: Changes can be discussed, but additions outside the agreed scope may affect the quote or project requirements.
  ar: يمكن مناقشة التغييرات، لكن أي إضافات خارج النطاق المتفق عليه قد تؤثر في عرض السعر أو متطلبات المشروع.
- en: When do I review the website?
  ar: متى أراجع الموقع؟
- en: A review stage takes place before final deployment.
  ar: تأتي مرحلة المراجعة قبل النشر النهائي.
- en: What happens after the website is finished?
  ar: ماذا يحدث بعد اكتمال الموقع؟
- en: The website is deployed and the final project is handed over in a clean, maintainable structure.
  ar: ينشر الموقع ويسلم المشروع النهائي بهيكل نظيف وسهل الصيانة.
- en: YOUR PROJECT://STAGE 00
  ar: مشروعك · المرحلة 00
- en: Every build starts<br>with an idea.
  ar: كل مشروع يبدأ<br>بفكرة.
- en: Bring us yours. We’ll help give it structure.
  ar: أحضر فكرتك، ونساعدك على منحها هيكلا.
- en: View Services & Pricing →
  ar: عرض الخدمات والأسعار ←
