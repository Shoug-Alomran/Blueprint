- en: STAGE://01 — PROJECT REQUEST
  ar: المرحلة 01 — طلب المشروع
- en: Tell us what<br>you’re building.
  ar: أخبرنا بما<br>تريد بناءه.
- en: The process starts with your idea. Tell Blueprint what you need, who the website is for, and what you want it to accomplish.
  ar: 'تبدأ المراحل بفكرتك: أخبر بلو برينت بما تحتاجه، ولمن الموقع، وما الذي تريد أن يحققه.'
- en: Share your purpose and audience.
  ar: شارك غرضك وجمهورك.
- en: PROJECT REQUEST / EXAMPLE
  ar: طلب مشروع / مثال
- en: REQUEST RECEIVED
  ar: استلم الطلب
- en: Explore the fit check →
  ar: تعرف على تقييم الملاءمة ←
- en: STAGE://02 — DISCOVERY
  ar: المرحلة 02 — الاستكشاف
- en: Understand<br>before designing.
  ar: افهم<br>قبل أن تصمم.
- en: We review the purpose, audience, content, requirements, and identity of the project before building anything. The result is a shared understanding of what the website needs to do.
  ar: نراجع غرض المشروع وجمهوره ومحتواه ومتطلباته وهويته قبل بناء أي شيء، لنصل إلى فهم مشترك لما يجب أن يؤديه الموقع.
- en: Discover the requirements.
  ar: اكتشاف المتطلبات.
- en: The discovery checklist →
  ar: قائمة الاستكشاف ←
- en: STAGE://03 — SCOPE & QUOTE
  ar: المرحلة 03 — النطاق وعرض السعر
- en: Define exactly<br>what we’re building.
  ar: حدد بدقة<br>ما سنبنيه.
- en: Pages, features, deliverables, and the investment are agreed before development begins. This keeps expectations clear before the first page is built.
  ar: نتفق على الصفحات والميزات والمخرجات والتكلفة قبل بدء التطوير، لتبقى التوقعات واضحة قبل بناء الصفحة الأولى.
- en: Agree deliverables and quote.
  ar: الاتفاق على المخرجات وعرض السعر.
- en: PROJECT DEFINITION
  ar: تعريف المشروع
- en: SCOPED
  ar: محدد النطاق
- en: DELIVERABLES
  ar: المخرجات
- en: Confirmed
  ar: مؤكد
- en: Defined
  ar: محدد
- en: Scope
  ar: النطاق
- en: Request
  ar: الطلب
- en: STAGE://04 — STRUCTURE
  ar: المرحلة 04 — الهيكل
- en: Build the<br>blueprint first.
  ar: ابن<br>المخطط أولا.
- en: Before visual polish comes structure. Content, pages, navigation, and hierarchy are organized into a clear experience.
  ar: 'الهيكل يسبق اللمسات البصرية: ينظم المحتوى والصفحات والتنقل والتسلسل في تجربة واضحة.'
- en: Organize pages and navigation.
  ar: تنظيم الصفحات والتنقل.
- en: INFORMATION ARCHITECTURE
  ar: هيكلة المعلومات
- en: PAGE STRUCTURE
  ar: هيكل الصفحات
- en: NAVIGATION
  ar: التنقل
- en: CONTENT HIERARCHY
  ar: تسلسل المحتوى
- en: Explore the structure stage →
  ar: تعرف على مرحلة الهيكلة ←
- en: STAGE://05 — DESIGN & BUILD
  ar: المرحلة 05 — التصميم والبناء
- en: Turn structure<br>into an experience.
  ar: حول الهيكل<br>إلى تجربة.
- en: The website takes shape through typography, layout, responsive behavior, visual details, and interaction. Each decision follows the structure we established together.
  ar: يتشكل الموقع عبر الخطوط والتخطيط والتجاوب والتفاصيل البصرية والتفاعل، وكل قرار يتبع الهيكل الذي وضعناه معا.
- en: Bring the visual system to life.
  ar: إحياء النظام البصري.
- en: THE BUILD / IN PROGRESS
  ar: البناء / قيد التنفيذ
- en: BUILDING
  ar: قيد البناء
- en: BUILD SPECIFICATION
  ar: مواصفات البناء
- en: VISUAL SYSTEM
  ar: النظام البصري
- en: LAYOUT
  ar: التخطيط
- en: INTERACTIONS
  ar: التفاعلات
- en: Inside the build →
  ar: من داخل مرحلة البناء ←
- en: STAGE://06 — REVIEW
  ar: المرحلة 06 — المراجعة
- en: Review.<br>Refine. Verify.
  ar: راجع.<br>حسن. تحقق.
- en: You review the finished website before deployment. We refine the agreed details and check the experience across desktop, tablet, and mobile.
  ar: تراجع الموقع المكتمل قبل نشره، ونحسن التفاصيل المتفق عليها ونختبر التجربة على الحاسوب والجهاز اللوحي والجوال.
- en: Review and refine the experience.
  ar: مراجعة التجربة وتحسينها.
- en: DEPLOYMENT / FINAL CHECK
  ar: النشر / الفحص النهائي
- en: READY TO BUILD
  ar: جاهز للبناء
- en: Desktop, tablet, and mobile previews
  ar: معاينات للحاسوب والجهاز اللوحي والجوال
- en: How review rounds work →
  ar: كيف تعمل جولات المراجعة ←
- en: STAGE://07 — DEPLOY & HANDOVER
  ar: المرحلة 07 — النشر والتسليم
- en: Ready for<br><em>the world.</em>
  ar: جاهز<br><em>للعالم.</em>
- en: Once approved, the final website is deployed and the project is handed over in a clean, maintainable structure. Your idea now has a home.
  ar: بعد الاعتماد، ينشر الموقع النهائي ويسلم المشروع بهيكل نظيف وسهل الصيانة. أصبح لفكرتك بيت.
- en: Deploy and hand over the project.
  ar: نشر المشروع وتسليمه.
- en: FINAL BUILD
  ar: النسخة النهائية
- en: What you receive at handover →
  ar: ما تستلمه عند التسليم ←
- en: THE FULL TRANSFORMATION
  ar: التحول الكامل
- en: One process. Seven stages.<br>One finished build.
  ar: منهجية واحدة. سبع مراحل.<br>وموقع واحد مكتمل.
