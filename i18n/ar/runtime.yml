patterns:
- match: ^Cart \((\d+)\)$
  ar: السلة (\1)
- match: ^([\d,.]+) SAR$
  ar: \1 ريال
- match: '^Total: ([\d,.]+) SAR$'
  ar: 'الإجمالي: \1 ريال'
- match: ^Large Document \(\+ ([\d,.]+) SAR\)$
  ar: مستند كبير (+ \1 ريال)
- match: ^Bilingual Report \(\+ ([\d,.]+) SAR\)$
  ar: تقرير ثنائي اللغة (+ \1 ريال)
- match: ^Checkout request failed with status (\d+)\.?$
  ar: تعذر إرسال الطلب (رمز الحالة \1).
