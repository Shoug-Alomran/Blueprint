# Text that scripts insert after the page loads (mainly docs/assets/storefront.js:
# cart, checkout, product buttons). Unlike the other files, these entries are
# embedded in every Arabic page and applied live by javascripts/i18n-runtime.js.
# Keep this file to runtime text only: everything in it ships with each page.
# Strings that go into the order email to the studio are intentionally absent.
