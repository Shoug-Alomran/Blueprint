  ar: النصوص والمواد المكتوبة
- en: Images, graphics, and diagrams
  ar: الصور والرسومات والمخططات
- en: Logos, branding elements, and third-party assets
  ar: الشعارات وعناصر الهوية والمواد المملوكة لأطراف ثالثة
- en: Academic claims and research statements
  ar: الادعاءات الأكاديمية والعبارات البحثية
