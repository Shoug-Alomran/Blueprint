- en: Email services
  ar: خدمات البريد الإلكتروني
- en: Form processing systems
  ar: أنظمة معالجة النماذج
- en: Hosting providers
  ar: مزودي الاستضافة
- en: Reasonable measures are taken to handle information securely.
  ar: نتخذ تدابير معقولة للتعامل مع المعلومات بأمان.
- en: Data Deletion Requests
  ar: طلبات حذف البيانات
- en: You may request deletion of submitted information by contacting us directly.
  ar: يمكنك طلب حذف المعلومات التي أرسلتها بالتواصل معنا مباشرة.
- en: Revision Policy - Blueprint
  ar: سياسة التعديلات - بلو برينت
- en: Revision Policy
  ar: سياسة التعديلات
- en: Learn how Blueprint handles revision rounds, scope limits, additional requests, and approval boundaries during website delivery.
  ar: تعرف على كيفية تعامل بلو برينت مع جولات التعديل وحدود النطاق والطلبات الإضافية وحدود الاعتماد أثناء تسليم الموقع.
- en: To maintain efficiency, fairness, and predictable delivery, all projects include a limited number of revision rounds as defined in the agreed package.
  ar: حفاظا على الكفاءة والعدالة ووضوح مواعيد التسليم، تتضمن جميع المشاريع عددا محدودا من جولات التعديل وفق ما تحدده الباقة المتفق عليها.
- en: What Counts as a Revision
  ar: ما يعد تعديلا
- en: A revision round refers to a single, consolidated set of feedback submitted at one time.
  ar: جولة التعديل هي مجموعة واحدة موحدة من الملاحظات ترسل دفعة واحدة.
- en: A revision may include:, Text edits, Minor layout adjustments, Color refinements, Section rearrangements within existing structure, Small structural clarifications
  ar: قد يشمل التعديل:، تعديل النصوص، تعديلات طفيفة على التخطيط، تحسين الألوان، إعادة ترتيب الأقسام ضمن الهيكل الحالي، توضيحات هيكلية بسيطة
- en: What Is Considered New Scope
  ar: ما يعد نطاقا جديدا
- en: The following fall outside revision scope:, Major layout redesign, Adding new pages beyond the agreed package, Adding features not previously discussed, Changing overall direction after draft delivery, Reworking approved sections from scratch
  ar: يقع ما يلي خارج نطاق التعديلات:، إعادة تصميم التخطيط جذريا، إضافة صفحات جديدة تتجاوز الباقة المتفق عليها، إضافة ميزات لم تناقش سابقا، تغيير التوجه العام بعد تسليم المسودة، إعادة العمل على أقسام معتمدة من البداية
- en: Such requests may require a revised quote before implementation.
  ar: قد تتطلب هذه الطلبات عرض سعر معدلا قبل التنفيذ.
- en: Revision Round Guidelines, Feedback must be consolidated into a single message per round., Feedback should reference specific sections or pages., Vague requests (e.g., "make it better") may require clarification before changes are made., Additional feedback submitted after a round has been completed may count as a new revision round.
  ar: إرشادات جولات التعديل، يجب جمع الملاحظات في رسالة واحدة لكل جولة.، يجب أن تشير الملاحظات إلى أقسام أو صفحات محددة.، قد تحتاج الطلبات المبهمة (مثل «اجعله أفضل») إلى توضيح قبل إجراء التغييرات.، قد تحتسب الملاحظات الإضافية المرسلة بعد اكتمال الجولة جولة تعديل جديدة.
- en: Timeline Impact, Delays in submitting feedback may extend the project timeline., Projects may be paused if feedback is not received within a reasonable timeframe.
  ar: الأثر على الجدول الزمني، قد يؤدي التأخر في إرسال الملاحظات إلى تمديد مدة المشروع.، قد يعلق المشروع إذا لم تصل الملاحظات خلال مدة معقولة.
- en: Final Approval
  ar: الاعتماد النهائي
- en: Once final approval is given:, The project moves to payment., No additional revisions are included., Handover occurs after payment confirmation.
  ar: بعد منح الاعتماد النهائي:، ينتقل المشروع إلى مرحلة الدفع.، لا تشمل أي تعديلات إضافية.، يتم التسليم بعد تأكيد الدفع.
- en: Revisions are intended to refine, not redesign, the approved structure.
  ar: الغرض من التعديلات تحسين الهيكل المعتمد، لا إعادة تصميمه.
- en: Structured feedback leads to efficient delivery.
  ar: الملاحظات المنظمة تؤدي إلى تسليم أكثر كفاءة.
- en: Content Responsibility - Blueprint
  ar: المسؤولية عن المحتوى - بلو برينت
- en: Content Responsibility Policy
