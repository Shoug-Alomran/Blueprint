- en: This page defines ownership boundaries for both Blueprint and its clients.
  ar: تحدد هذه الصفحة حدود الملكية لكل من بلو برينت وعملائه.
- en: All content, structure, and design systems used across Blueprint Studio websites are protected under applicable intellectual property laws.
  ar: جميع المحتويات والهياكل وأنظمة التصميم المستخدمة في مواقع بلو برينت ستوديو محمية بموجب أنظمة الملكية الفكرية المعمول بها.
