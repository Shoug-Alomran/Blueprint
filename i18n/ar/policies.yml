- en: All payments are non-refundable once final approval has been granted.
  ar: جميع المدفوعات غير قابلة للاسترداد بعد منح الاعتماد النهائي.
- en: 4. Intellectual Property
  ar: 4. الملكية الفكرية
- en: 'Upon full payment:'
  ar: 'بعد سداد المبلغ كاملا:'
- en: The client retains ownership of all content they provide.
  ar: يحتفظ العميل بملكية كل المحتوى الذي يقدمه.
- en: The client receives rights to use the final website deliverable.
