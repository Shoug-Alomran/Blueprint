  ar: يحصل العملاء على حقوق استخدام موقعهم المسلم، لا على ملكية الإطار الأساسي أو منهجية التصميم الخاصة بـ بلو برينت.
- en: Blueprint reserves the right to reuse structural systems across future projects.
  ar: يحتفظ بلو برينت بحق إعادة استخدام الأنظمة الهيكلية في المشاريع المستقبلية.
