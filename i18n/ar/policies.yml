  ar: البريد الإلكتروني
- en: Project details submitted through inquiry forms
  ar: تفاصيل المشروع المرسلة عبر نماذج الاستفسار
- en: How Information Is Used
  ar: كيفية استخدام المعلومات
- en: 'Your information is used solely to:'
  ar: 'تستخدم معلوماتك حصرا من أجل:'
