- en: Privacy Policy
  ar: سياسة الخصوصية
- en: Read Blueprint's privacy policy covering inquiry data, processing systems, communication handling, and deletion requests.
  ar: 'اطلع على سياسة الخصوصية في بلو برينت: بيانات الاستفسارات، وأنظمة المعالجة، وطريقة التواصل، وطلبات الحذف.'
- en: Blueprint by ShougTech respects your privacy.
  ar: يحترم بلو برينت من ShougTech خصوصيتك.
