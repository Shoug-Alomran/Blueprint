  ar: تقديم الخدمات المطلوبة
- en: Communicate about project progress
  ar: التواصل بشأن سير المشروع
- en: We do not sell or share personal information for marketing purposes.
  ar: لا نبيع المعلومات الشخصية ولا نشاركها لأغراض تسويقية.
- en: Data Storage
  ar: تخزين البيانات
- en: 'Information may be processed through:'
