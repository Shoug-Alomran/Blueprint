  ar: تحكم شروط الخدمة هذه الخدمات التي يقدمها بلو برينت من ShougTech.
- en: By requesting, approving, or proceeding with a project, you agree to these terms.
  ar: بطلبك مشروعا أو اعتماده أو المضي فيه، فإنك توافق على هذه الشروط.
- en: 1. Scope of Services
  ar: 1. نطاق الخدمات
- en: 'Blueprint provides structured static website development services, including:'
  ar: 'يقدم بلو برينت خدمات تطوير مواقع ثابتة منظمة، تشمل:'
- en: Academic documentation websites
  ar: مواقع التوثيق الأكاديمي
- en: Workshop or course landing pages
  ar: الصفحات التعريفية لورش العمل أو المقررات
- en: Services are limited to static website architecture.
  ar: تقتصر الخدمات على بنية المواقع الثابتة.
- en: 'The following are not included:'
  ar: 'لا يشمل ذلك ما يلي:'
