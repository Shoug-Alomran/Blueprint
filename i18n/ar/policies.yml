- en: Terms of Service
  ar: شروط الخدمة
- en: Review Blueprint's terms of service for project scope, delivery limits, client responsibilities, payments, and handover conditions.
  ar: 'اطلع على شروط الخدمة في بلو برينت: نطاق المشروع، وحدود التسليم، ومسؤوليات العميل، والدفع، وشروط التسليم.'
