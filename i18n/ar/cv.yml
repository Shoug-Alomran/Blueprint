- en: CATALOG://CV TEMPLATES <i></i>
  ar: الكتالوج · قوالب السيرة الذاتية <i></i>
- en: Ten templates.<br><em>One first impression.</em>
  ar: عشرة قوالب.<br><em>وانطباع أول واحد.</em>
- en: Every template below is live on this page — scroll through the real thing, open it full screen, then pick the one that fits you. Each works on mobile and prints cleanly to PDF.
  ar: كل قالب أدناه يعمل مباشرة على هذه الصفحة — تصفح القالب الحقيقي، وافتحه بملء الشاشة، ثم اختر ما يناسبك. جميعها تعمل على الجوال وتطبع بصيغة PDF بوضوح.
