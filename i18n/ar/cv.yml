- en: DONE-FOR-YOU
  ar: ننجزه لك
- en: Prefer it filled in?
  ar: تفضل أن نملأه لك؟
- en: Send your details and we'll populate the template and integrate it into your site. Basic 100 SAR · Pro 130 SAR, delivered in 2–3 working days.
  ar: أرسل بياناتك وسنملأ القالب وندمجه في موقعك. الأساسي 100 ريال · الاحترافي 130 ريال، ويسلم خلال 2 إلى 3 أيام عمل.
- en: CHOOSE://YOUR TEMPLATE
  ar: اختر · قالبك
- en: Found the one?
  ar: وجدت ما يناسبك؟
- en: Tell us which template and whether you want the file or the done-for-you version. We'll confirm and send it over.
  ar: أخبرنا بالقالب الذي اخترته، وهل تريد الملف فقط أم نسخة ننجزها لك، وسنؤكد الطلب ونرسله إليك.
- en: Request a Template →
  ar: اطلب قالبا ←
