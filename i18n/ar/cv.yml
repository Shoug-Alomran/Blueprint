- en: Previews are the real templates, shown at reduced scale. Open any one full screen to scroll it properly and test it on your phone.
  ar: المعاينات هي القوالب الحقيقية معروضة بحجم مصغر. افتح أيا منها بملء الشاشة لتتصفحه كما ينبغي وتجربه على جوالك.
