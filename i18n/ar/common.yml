# Shared chrome: header, footer, search, and labels used on many pages.
#
# How this catalog works: every Arabic page (/ar/...) is built from the same
# English templates, then translated from these files by hooks/i18n_ar.py.
# `en` must match the rendered English exactly (whitespace does not matter).
# Entries containing tags translate a whole sentence, markup included.
# After a build, any English left on an Arabic page is listed in
# i18n/missing-ar.txt.
#
# Conventions used throughout:
#   - "Blueprint" / "Blueprint Studio" stay in Latin, matching the wordmark.
#   - HTML, PDF, CSS and SEO stay in Latin, as they are written in Arabic tech copy.
#   - Prices use Western digits and "ريال".
#   - Arrows are mirrored for right-to-left reading: → becomes ←, ↗ becomes ↖.
