- en: Start Project - Blueprint
  ar: ابدأ مشروعك - بلو برينت
- en: Start a Blueprint website project by reviewing fit requirements, delivery boundaries, and the intake path for new static website work.
  ar: 'ابدأ مشروع موقعك مع بلو برينت: راجع متطلبات الملاءمة وحدود التسليم وخطوات استقبال مشاريع المواقع الثابتة الجديدة.'
- en: Blueprint Studio
  ar: بلو برينت ستوديو
- en: intake://start-project
  ar: الاستقبال · ابدأ مشروعك
- en: Your next chapter<br><em>starts here.</em>
  ar: فصلك القادم<br><em>يبدأ من هنا.</em>
- en: Tell us what the website is for, what you want to share, and when you need it. We’ll review your brief and come back with a clear scope and quote.
  ar: أخبرنا بالغرض من الموقع، وما تريد مشاركته، ومتى تحتاجه. سنراجع طلبك ونعود إليك بنطاق واضح وعرض سعر.
- en: Review Pricing
  ar: راجع الأسعار
- en: Tell us about your project.
  ar: حدثنا عن مشروعك.
- en: Share what you know. We’ll confirm the details, scope, and quote together.
  ar: شارك ما تعرفه، ونؤكد التفاصيل والنطاق وعرض السعر معا.
