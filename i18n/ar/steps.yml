- en: The client assumes full responsibility for ongoing content updates unless a maintenance add-on was agreed in writing. Hosting platform limitations and third-party service policies fall outside Blueprint's control after handover.
  ar: يتحمل العميل المسؤولية الكاملة عن تحديثات المحتوى اللاحقة، ما لم يتفق كتابيا على إضافة الصيانة. وتقع قيود منصات الاستضافة وسياسات خدمات الأطراف الثالثة خارج سيطرة بلو برينت بعد التسليم.
