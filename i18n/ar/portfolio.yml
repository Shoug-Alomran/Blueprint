- en: A two-phase operating systems study measuring process and thread parallelism, with an interactive thread lab and scaling charts.
  ar: دراسة من مرحلتين في أنظمة التشغيل تقيس التوازي على مستوى العمليات والخيوط، مع مختبر تفاعلي للخيوط ورسوم بيانية لقابلية التوسع.
- en: Requirements engineering for Sillah, a family cardiac-health platform, from stakeholder interviews to use cases and prioritised requirements.
  ar: هندسة متطلبات منصة صلة لصحة القلب العائلية، من مقابلات أصحاب المصلحة إلى حالات الاستخدام والمتطلبات المرتبة حسب الأولوية.
- en: A database project documented phase by phase, from the EER model and relational schema to SQL and the finished full-stack application.
  ar: مشروع قواعد بيانات موثق مرحلة بمرحلة، من نموذج EER والمخطط العلائقي إلى SQL والتطبيق المتكامل النهائي.
- en: A personal engineering portfolio bringing software projects, cybersecurity labs, and coursework into one navigable home.
  ar: ملف أعمال هندسي شخصي يجمع مشاريع البرمجيات ومختبرات الأمن السيبراني والمقررات في موقع واحد سهل التصفح.
- en: Filter projects by package
  ar: تصفية المشاريع حسب الباقة
