- en: Portfolio - Blueprint
  ar: الأعمال - بلو برينت
- en: Explore Blueprint website work examples across portfolios, documentation websites, and workshop or course pages.
  ar: 'استعرض نماذج من أعمال بلو برينت: ملفات أعمال، ومواقع توثيق، وصفحات ورش عمل ومقررات.'
- en: PORTFOLIO://SELECTED WORK
  ar: الأعمال · مختارات
- en: Real work.<br><em>Thoughtfully built.</em>
  ar: أعمال حقيقية.<br><em>مبنية بعناية.</em>
- en: Websites for people with something to share — portfolios, course hubs, project documentation, and event pages, each built as a clear digital experience.
  ar: مواقع لمن لديه ما يشاركه — ملفات أعمال، ومنصات مقررات، وتوثيق مشاريع، وصفحات فعاليات، كل منها مبني كتجربة رقمية واضحة.
- en: PERSONAL PRESENCE · COURSE HUBS · DOCUMENTATION · EVENT HUBS
  ar: حضور شخصي · منصات مقررات · توثيق · منصات فعاليات
- en: Filter projects
  ar: تصفية المشاريع
- en: All work
  ar: كل الأعمال
- en: Personal presence
  ar: الحضور الشخصي
- en: Course hubs
  ar: منصات المقررات
- en: Project documentation
  ar: توثيق المشاريع
- en: Event hubs
  ar: منصات الفعاليات
- en: 8 projects
  ar: 8 مشاريع
- en: Visit website ↗
  ar: زيارة الموقع ↖
- en: A course hub organising four modules — threat landscape, the CIA triad, access control, and protection mechanisms — into a guided path.
  ar: منصة مقرر تنظم أربع وحدات — مشهد التهديدات، وثلاثية CIA، والتحكم في الوصول، وآليات الحماية — في مسار موجه.
- en: A competition hub for ACM and PSU’s College of Computer & Information Sciences, covering three workshop days and the final build-off.
  ar: منصة مسابقة لفرع ACM وكلية علوم الحاسب والمعلومات في جامعة الأمير سلطان، تغطي ثلاثة أيام من ورش العمل والتحدي النهائي.
- en: Registration, challenge tracks, and participant resources for a three-hour capture-the-flag competition.
  ar: التسجيل ومسارات التحديات وموارد المشاركين لمسابقة «التقاط العلم» (CTF) مدتها ثلاث ساعات.
- en: A chapter archive documenting PSU ACM’s programming competitions, cybersecurity events, workshops, and history.
  ar: أرشيف يوثق مسابقات البرمجة وفعاليات الأمن السيبراني وورش العمل وتاريخ فرع ACM في جامعة الأمير سلطان.
- en: Architecture documentation for the Intaliq platform, organised across the 4+1 view model with quality attributes and design patterns.
  ar: توثيق معماري لمنصة انطلق، منظم وفق نموذج العروض 4+1 مع سمات الجودة وأنماط التصميم.
- en: Project documentation for the National Employment & Skill Matching Platform, carried from planning through delivery.
  ar: توثيق مشروع المنصة الوطنية للتوظيف ومواءمة المهارات، من التخطيط حتى التسليم.
- en: A structured showcase analysing the ethical, social, and sustainability implications of AI and expert systems.
  ar: عرض منظم يحلل الآثار الأخلاقية والاجتماعية والبيئية للذكاء الاصطناعي والأنظمة الخبيرة.
- en: The illustrations above show each project’s structure. Open a website to explore the live design. Portfolio examples include personal, academic, and client work. Blueprint’s service is the website and documentation; any underlying applications are separate.
  ar: توضح الرسومات أعلاه هيكل كل مشروع، وبإمكانك فتح أي موقع لاستكشاف تصميمه الحي. تشمل النماذج أعمالا شخصية وأكاديمية وأعمالا لعملاء. تقتصر خدمة بلو برينت على الموقع والتوثيق، وأي تطبيقات خلفها منفصلة عنها.
- en: DETAILS://IN MOTION
  ar: التفاصيل · أثناء الحركة
- en: See the experience<br>in action.
  ar: شاهد التجربة<br>وهي تعمل.
- en: Short walkthroughs show how navigation, language switching, and thoughtful interactions work across our websites.
  ar: جولات قصيرة توضح كيف يعمل التنقل وتبديل اللغة والتفاعلات المدروسة في مواقعنا.
- en: Explore Feature Demos →
  ar: استعرض عروض الميزات ←
- en: Made to be<br><em>explored.</em>
  ar: مصمم<br><em>ليستكشف.</em>
- en: RESPONSIVE / CONSIDERED / CONNECTED
  ar: متجاوب / مدروس / مترابط
- en: YOUR PROJECT://NEXT
  ar: مشروعك · التالي
- en: Let’s make room<br>for your work.
  ar: لنفسح المجال<br>لأعمالك.
- en: Bring the content. We’ll help it find its shape.
  ar: أحضر المحتوى، ونساعدك على منحه الشكل المناسب.
