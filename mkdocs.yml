site_name: Blueprint
site_url: https://blueprint.shoug-tech.com/
site_author: Shoug Fawaz Alomran
site_description: >
  Blueprint is a student-focused digital presence studio under ShougTech.
  We build structured static websites for portfolios, academic documentation, and workshop/course pages.
copyright: © 2026 Blueprint · All rights reserved

theme:
  name: material
  custom_dir: overrides
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  font:
    text: Manrope
    code: JetBrains Mono

nav:
  - Home: index.md
  - Products:
      - All Products: products/index.md
      - CV Templates: CV_index/index.md
      - HTML Report Conversions: html-reports/index.md
  - Services & Pricing: packages/index.md
  - How It Works:
      - Process Overview: process/index.md
      - Intake & Fit Check: process/intake-fit-check.md
      - Discovery: process/discovery.md
      - Structure & Sitemap: process/structure-sitemap.md
      - Build: process/build.md
      - Review & Revisions: process/revision-rounds.md
      - Deployment & Handover: process/deployment-handover.md
  - Start a Project: start-project/index.md
  - Portfolio:
      - Client Work: web-platforms/index.md
      - Feature Demos: work-demos/index.md
  - About: about/index.md
  - Contact: contact/index.md

exclude_docs: |
  home/**
  architecture-notes/**
  infrastructure/**
  systems/**
  templates/**

markdown_extensions:
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.inlinehilite

plugins:
  - search
  # Arabic lives at /ar/. Pages with a `.ar.md` file use it (long-form prose:
  # policies, process steps, demos); every other page falls back to the
  # English source, and hooks/i18n_ar.py translates its rendered output from
  # i18n/ar/*.yml. Templates in overrides/ therefore stay plain English.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ar
          name: العربية
          build: true
          site_description: استوديو في الرياض يبني مواقع ثابتة واضحة ومنظمة، ويحول التقارير إلى HTML، ويصمم قوالب السيرة الذاتية.
          nav_translations:
            Home: الرئيسية
            Products: المنتجات
            All Products: جميع المنتجات
            CV Templates: قوالب السيرة الذاتية
            HTML Report Conversions: تحويل التقارير إلى HTML
            Services & Pricing: الخدمات والأسعار
            How It Works: آلية العمل
            Process Overview: نظرة عامة على المراحل
            Intake & Fit Check: الاستقبال وتقييم الملاءمة
            Discovery: الاستكشاف
            Structure & Sitemap: الهيكلة وخريطة الموقع
            Build: البناء
            Review & Revisions: المراجعة والتعديلات
            Deployment & Handover: النشر والتسليم
            Start a Project: ابدأ مشروعك
            Portfolio: الأعمال
            Client Work: أعمالنا
            Feature Demos: عروض الميزات
            About: من نحن
            Contact: تواصل معنا

# `mkdocs serve` only rebuilds when a watched file changes. The Arabic
# translations (i18n/) and the build hooks live outside docs/, so without
# these entries edits to them would not show up until a restart.
watch:
  - i18n
  - hooks

hooks:
  - hooks/sitemap_filter.py
  - hooks/search_index_from_html.py
  - hooks/i18n_ar.py
  - hooks/rtl_css.py

validation:
  nav:
    omitted_files: ignore
    not_found: warn
    absolute_links: ignore
  links:
    not_found: ignore
    unrecognized_links: ignore

extra_css:
  - styles/tokens.css
  - styles/layout.css
  - styles/components.css
  - styles/blueprint.css
  - styles/home.css
  - styles/pages.css
  - styles/products.css
  - styles/studio.css
  - styles/showcase.css
  - styles/arabic.css

extra:
  generator: false

extra_javascript:
  - javascripts/i18n-runtime.js
  - javascripts/theme-toggle.js
  - javascripts/search.js
  - javascripts/blueprint-motion.js
  - javascripts/cta-footer.js
  - assets/storefront.js
  - javascripts/cv-purchase.js
  - javascripts/standalone-theme.js
  - javascripts/studio.js
